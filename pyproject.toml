[project]
name = "leadpilot"
version = "1.2.0"
description = "LeadPilot – leads dashboard with smart WhatsApp replies and a Claude sales assistant"
requires-python = ">=3.12"

[tool.ruff]
line-length = 160
target-version = "py312"
extend-exclude = [".railway", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
  "B008",  # FastAPI's Depends(...) in defaults is the framework's idiom
]

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"]  # env must be set before the app is imported
"evals/run.py" = ["E402"]       # same: a throwaway database before import

[tool.pytest.ini_options]
testpaths = ["tests"]
